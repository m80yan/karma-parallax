<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karma Parallax Prototype</title>
  <style>
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/Inter-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "PingFangPacked";
      src: url("assets/fonts/PingFangSC-subset.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "PingFangPacked";
      src: url("assets/fonts/PingFangSC-Semibold-subset.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --prototype-width: 640px;
      --prototype-height: 1136px;
      --mockup-width: 767px;
      --mockup-height: 1380px;
      --devices-width: 1694px;
      --devices-height: 1380px;
      --embed-padding: 24px;
      --stage-scale: 1;
      --screen-x: 67px;
      --screen-y: 239px;
      --screen-bg: rgb(171, 212, 126);
      --karma-green: rgb(11, 116, 63);
      --motion-cycle: 8s;
      --motion-breathe: 4.8s;
      --motion-clouds: 18s;
      --motion-score: 500ms;
      --reel-dur: 1400ms;
      --reel-spin-blur: 3px;
      --reel-stagger: 90ms;
      --reel-ease: cubic-bezier(0.16, 1, 0.3, 1);
      --motion-rays: 7s;
      --motion-sun: 12s;
      --cloud-edge-pad: 120px;
      --parallax-far: 2px;
      --parallax-mid: 5px;
      --parallax-near: 10px;
      --push-scale: 1.05;
      --font-display: "PingFangPacked", "PingFang SC", "PingFangSC", "Helvetica Neue", Arial, sans-serif;
      --font-score: "PingFangPacked", "PingFang SC", "PingFangSC", "Helvetica Neue", Arial, sans-serif;
      --score-font-size: 72px;
      --score-font-weight: 400;
      --score-line-height: 1;
      --score-letter-space: 2px;
      --score-digit-width: 0.58em;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: #d8d8d8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .devices {
      display: flex;
      align-items: flex-start;
      gap: 160px;
      position: absolute;
      left: 0;
      top: 50%;
      width: var(--devices-width);
      height: var(--devices-height);
      transform: translateY(-50%) scale(var(--stage-scale));
      transform-origin: left center;
    }

    .device-frame {
      width: var(--mockup-width);
      height: var(--mockup-height);
      position: relative;
      overflow: visible;
      box-shadow: none;
    }

    .phone-mockup {
      position: absolute;
      left: 0;
      top: 0;
      width: 767px;
      height: 1375px;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }

    .phone-mockup img {
      position: absolute;
      left: -48.74%;
      top: -28.14%;
      width: 333.85%;
      height: 186.18%;
      max-width: none;
      display: block;
    }

    .phone-mockup--yellow {
      left: 1px;
    }

    .phone-mockup--yellow img {
      left: -176.9%;
    }

    .phone-shell {
      width: var(--prototype-width);
      height: var(--prototype-height);
      position: absolute;
      left: var(--screen-x);
      top: var(--screen-y);
      overflow: hidden;
      background: var(--screen-bg);
      transform-origin: center;
      z-index: 2;
    }

    .phone-shell--yellow {
      left: 68px;
      background: #ffbf47;
    }

    .phone-shell--yellow .screen {
      background: #ffbf47;
    }

    .animatable {
      --speed: 1;
      --direction: normal;
      --ease: ease-in-out;
      animation-duration: calc(var(--base-dur) / max(var(--speed), 0.05)) !important;
      animation-direction: var(--direction) !important;
      animation-timing-function: var(--ease) !important;
    }

    .screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--screen-bg);
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 39px;
      z-index: 30;
      color: #fff;
      font-family: var(--font-display);
      font-size: 24px;
      line-height: normal;
      font-weight: 400;
      letter-spacing: 0;
      pointer-events: none;
      user-select: none;
    }

    .status-bar img,
    .status-bar span {
      position: absolute;
      display: block;
    }

    .status-signal-full-1 { left: 13px; top: 17px; width: 11px; height: 11px; }
    .status-signal-full-2 { left: 27px; top: 17px; width: 11px; height: 11px; }
    .status-signal-full-3 { left: 41px; top: 17px; width: 11px; height: 11px; }
    .status-signal-full-4 { left: 55px; top: 17px; width: 11px; height: 11px; }
    .status-signal-empty { left: 69px; top: 17px; width: 11px; height: 11px; }
    .status-text {
      height: 34px;
      display: flex !important;
      align-items: center;
      white-space: nowrap;
    }

    .status-carrier { left: 89px; top: 5px; width: 65px; }
    .status-wifi { left: 155px; top: 11px; width: 24px; height: 24px; }
    .status-location { left: 478px; top: 12px; width: 20px; height: 20px; }
    .status-percent { left: 510px; top: 5px; width: 62px; }
    .status-battery { left: 580px; top: 11px; width: 49px; height: 24px; }

    .status-time {
      position: absolute;
      top: 5px;
      left: 270.58px;
      width: 97px;
      font-weight: 500;
      justify-content: center;
      white-space: nowrap;
    }

    .layer {
      position: absolute;
      pointer-events: none;
      transform-origin: center;
    }

    .layer img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .clickable-region,
    [data-control] {
      pointer-events: auto;
    }

    [data-control] {
      cursor: pointer;
    }

    .layer img[data-control] {
      pointer-events: auto;
      cursor: pointer;
    }

    [data-control] > img {
      pointer-events: none;
    }

    .sky {
      inset: 0 0 0 0;
      background: var(--screen-bg);
    }

    .far-hills {
      left: 0;
      top: 707.5px;
      width: 640px;
      height: 428.5px;
      overflow: hidden;
      clip-path: path("M0 45.6659C0 45.6659 196.635 55.0641 294.952 44.5412C409.968 32.2312 640 0 640 0V428.498H0V45.6659Z");
    }

    .far-hills-texture {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(100% + 32px);
      height: 100%;
      --base-dur: 9s;
      background-image: url("assets/far-background-texture-tile.svg");
      background-repeat: repeat;
      background-size: 32px 32px;
      animation: farTextureDrift 9s linear infinite;
      will-change: transform;
    }

    .background-hills {
      left: 0;
      top: 667.13px;
      width: 640px;
      height: 468.02px;
    }

    .background-slope,
    .background-triangles {
      position: absolute;
      inset: 0;
      width: 640px;
      height: 468.02px;
    }

    .group-scale-control {
      position: absolute;
      inset: 0;
      --group-scale: 1;
      pointer-events: auto;
      cursor: pointer;
    }

    .background-triangles {
      --base-dur: 5.6s;
      --follow-y: 12px;
      animation: squashFollower var(--base-dur) ease-in-out infinite;
      will-change: transform;
    }

    .background-triangles #Triangles path {
      transform-box: fill-box;
      transform-origin: center;
      animation: triangleTwinkle 3.2s ease-in-out infinite;
    }

    .background-triangles #Triangles path:nth-child(2) { animation-delay: .25s; }
    .background-triangles #Triangles path:nth-child(3) { animation-delay: .5s; }
    .background-triangles #Triangles path:nth-child(4) { animation-delay: .75s; }
    .background-triangles #Triangles path:nth-child(5) { animation-delay: 1s; }
    .background-triangles #Triangles path:nth-child(6) { animation-delay: 1.25s; }
    .background-triangles #Triangles path:nth-child(7) { animation-delay: 1.5s; }
    .background-triangles #Triangles path:nth-child(8) { animation-delay: 1.75s; }
    .background-triangles #Triangles path:nth-child(9) { animation-delay: 2s; }

    .midground-grass {
      left: 0;
      top: 772px;
      width: 640px;
      height: 366.48px;
    }

    .grass-part {
      position: absolute;
      left: 0;
      width: 640px;
      object-fit: fill;
      transform-origin: center bottom;
    }

    .grass-2 {
      top: 31px;
      height: 335.48px;
    }

    .grass-3 {
      top: 0;
      height: 365.9px;
    }

    .vertical-squash {
      --base-dur: 5.6s;
      --squash-scale: .95;
      animation: verticalSquash var(--base-dur) ease-in-out infinite;
      transform-origin: center bottom;
      will-change: transform;
    }

    .grass-dot {
      position: absolute;
      width: 5.12px;
      height: 5.12px;
      border-radius: 50%;
      background: rgba(181, 219, 116, 0.86);
      transform-origin: center;
      --base-dur: 2.8s;
      animation: dotTwinkle 2.8s ease-in-out infinite;
    }

    .grass-dots-follow {
      position: absolute;
      inset: 0;
      --base-dur: 5.6s;
      --follow-y: 20px;
      animation: squashFollower var(--base-dur) ease-in-out infinite;
      pointer-events: none;
      will-change: transform;
    }

    .foreground-bushes {
      left: 0;
      top: 857px;
      width: 640px;
      height: 279px;
    }

    .bush-item {
      position: absolute;
      transform-origin: center bottom;
      --base-dur: var(--motion-breathe);
      animation: bushBreathe var(--motion-breathe) ease-in-out infinite;
      will-change: transform;
    }

    .bush-ball {
      transform-origin: center;
      animation-name: bushBallMotion;
      will-change: transform;
    }

    .bush-base {
      position: absolute;
      left: 0;
      top: 97.05px;
      width: 640px;
      height: 182.1px;
      animation: none;
    }

    .ladybug {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      width: 32px;
      height: 32px;
      opacity: 0;
      pointer-events: auto;
      transform-origin: center;
      will-change: transform, opacity;
      --speed: 1;
      --ladybug-appearance: 1;
      --ladybug-size-ratio: 4;
    }

    .ladybug.is-visible {
      opacity: 1;
    }

    .ladybug img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: rotate(var(--ladybug-rotation, 0deg));
      transform-origin: center;
    }

    .clouds {
      left: 39.14px;
      top: 496.65px;
      width: 650.35px;
      height: 90.66px;
      overflow: visible;
    }

    .cloud {
      position: absolute;
      --base-dur: var(--motion-clouds);
      animation: cloudDriftToRight var(--motion-clouds) linear infinite;
    }

    .cloud.to-left { animation-name: cloudDriftToLeft; }
    .cloud.to-right { animation-name: cloudDriftToRight; }

    .info {
      position: absolute;
      left: 34.5px;
      top: 90.5px;
      width: 564.5px;
      height: 347.5px;
      color: var(--karma-green);
      pointer-events: none;
    }

    .sun-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 261px;
      height: 261px;
      transform-origin: center;
    }

    .sun-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .spin-rays-green {
      --spin-rays-angle: 0deg;
      transform: rotate(var(--spin-rays-angle));
      transform-origin: center;
      transition: transform 420ms cubic-bezier(.34, 1.45, .64, 1);
      will-change: transform;
    }

    .rays {
      position: absolute;
      left: 130.5px;
      top: 130.5px;
      width: 0;
      height: 0;
      --flare-scale: 1.35;
      --flare-distance: 0;
      --flare-rotate: 60deg;
      --flare-opacity-1: 1;
      --flare-opacity-2: 0.82;
      --flare-opacity-3: 0.62;
      --base-dur: var(--motion-rays);
      --speed: 0.2;
      animation: flarePointerSweep var(--motion-rays) ease-in-out infinite;
      transform-origin: 0 0;
    }

    .ray {
      position: absolute;
      display: block;
      left: var(--flare-x);
      top: var(--flare-y);
      --flare-opacity: 0.82;
      transform: translate(-50%, -50%);
      transform-origin: center;
      animation-name: flarePointerItem;
      animation-duration: inherit;
      animation-timing-function: inherit;
      animation-direction: inherit;
      animation-iteration-count: inherit;
      will-change: transform, opacity, filter;
    }

    .score {
      position: absolute;
      left: 31.5px;
      top: 72.5px;
      width: 198px;
      height: 87px;
      font-family: var(--font-score);
      font-size: var(--score-font-size);
      line-height: var(--score-line-height);
      font-weight: var(--score-font-weight);
      letter-spacing: 0;
      color: var(--karma-green);
      overflow: visible;
    }

    .score-value {
      display: grid;
      grid-template-columns: repeat(var(--score-digits, 2), var(--score-digit-width));
      column-gap: var(--score-letter-space);
      align-items: baseline;
      justify-content: center;
      width: max-content;
      height: 100%;
      margin: 0 auto;
      transform-origin: center;
      --base-dur: var(--motion-score);
      --digit-distance: 8px;
      --digit-stagger: 70ms;
      --digit-blur: 2px;
      --digit-dir-x: 0;
      --digit-dir-y: 1;
      animation: none;
    }

    .score.is-resetting .score-value {
      visibility: hidden;
    }

    .score-reel {
      position: absolute;
      inset: 0;
      display: none;
      align-items: baseline;
      justify-content: center;
      height: 100%;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .score.is-resetting .score-reel {
      display: flex;
    }

    .score-reel-col {
      position: relative;
      width: var(--score-digit-width);
      height: 1em;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%);
    }

    .score-reel-col + .score-reel-col {
      margin-left: var(--score-letter-space);
    }

    .score-reel-strip {
      display: flex;
      flex-direction: column;
      transform: translateY(calc(var(--reel-from, 0) * -1em));
      will-change: transform, filter;
    }

    .score-reel-col.is-spinning .score-reel-strip {
      transition:
        transform var(--reel-dur) var(--reel-ease) var(--reel-delay, 0ms),
        filter var(--reel-dur) var(--reel-ease) var(--reel-delay, 0ms);
      transform: translateY(calc(var(--reel-to, 0) * -1em));
      filter: url(#scoreReelBlur);
    }

    .score-reel-digit {
      height: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      text-align: center;
    }

    .score-digit {
      display: inline-block;
      width: var(--score-digit-width);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .score-hundreds:empty {
      display: none;
    }

    .score-ones-group {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      width: var(--score-digit-width);
      overflow: visible;
    }

    .score-ones {
      display: inline-block;
      will-change: transform, opacity, filter;
    }

    .score-ones-group.is-animating .score-ones {
      animation: tDigitPopIn calc(var(--motion-score) / max(var(--speed), 0.05)) var(--ease) both;
    }

    @media (prefers-reduced-motion: reduce) {
      .score-ones-group .score-ones { animation: none !important; }
      .score-reel-strip { transition: none !important; filter: none !important; }
    }

    .horse {
      position: absolute;
      left: 109.5px;
      top: 150.5px;
      width: 42px;
      height: 42px;
      --base-dur: 5s;
      animation: horsePulse 5s ease-in-out infinite;
    }

    .copy {
      position: absolute;
      left: 291.5px;
      top: 31.5px;
      width: 273px;
      height: 286px;
      font-family: var(--font-display);
      color: var(--karma-green);
    }

    .copy h1 {
      margin: 0 0 40px;
      font-size: 28px;
      line-height: 40px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .copy ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 24px;
      line-height: 40px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .copy li {
      margin: 0;
    }

    .copy li::before {
      content: "· ";
      margin-right: 0;
    }

    .copy li.is-active::before {
      content: "● ";
    }

    @keyframes bushBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes bushBallMotion {
      0%, 100% { transform: rotate(-4deg) scale(1); }
      50% { transform: rotate(5deg) scale(1.035); }
    }

    @keyframes verticalSquash {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(var(--squash-scale)); }
    }

    @keyframes squashFollower {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(var(--follow-y)); }
    }

    @keyframes cloudDriftToRight {
      0% { transform: translateX(var(--cloud-start)); }
      100% { transform: translateX(var(--cloud-end)); }
    }

    @keyframes cloudDriftToLeft {
      0% { transform: translateX(var(--cloud-start)); }
      100% { transform: translateX(var(--cloud-end)); }
    }

    @keyframes farTextureDrift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-32px); }
    }

    @keyframes sunRotate {
      to { transform: rotate(360deg); }
    }

    @keyframes flarePulse {
      0%, 100% { opacity: 0.42; transform: scale(0.96); }
      50% { opacity: 0.72; transform: scale(1.04); }
    }

    @keyframes flarePointerSweep {
      0%, 100% { transform: rotate(0deg); }
      34% { transform: rotate(0deg); }
      68% { transform: rotate(var(--flare-rotate)); }
    }

    @keyframes flarePointerItem {
      0%, 100% {
        opacity: 0.5;
        filter: blur(0);
        transform: translate(-50%, -50%) translate(0, 0) scale(1);
      }
      34% {
        opacity: var(--flare-opacity);
        filter: blur(0.2px);
        transform:
          translate(-50%, -50%)
          translate(calc(var(--flare-x) * var(--flare-distance)), calc(var(--flare-y) * var(--flare-distance)))
          scale(var(--flare-scale));
      }
      68% {
        opacity: calc(var(--flare-opacity) * 0.85);
        filter: blur(0.15px);
        transform:
          translate(-50%, -50%)
          translate(calc(var(--flare-x) * var(--flare-distance)), calc(var(--flare-y) * var(--flare-distance)))
          scale(var(--flare-scale));
      }
    }

    @keyframes triangleTwinkle {
      0%, 100% { opacity: .32; transform: scale(calc(.82 * var(--group-scale, 1))); }
      45% { opacity: 1; transform: scale(calc(1.18 * var(--group-scale, 1))); }
      70% { opacity: .55; transform: scale(calc(.96 * var(--group-scale, 1))); }
    }

    @keyframes dotTwinkle {
      0%, 100% { opacity: 0.22; transform: scale(calc(0.72 * var(--group-scale, 1))); }
      45% { opacity: 1; transform: scale(calc(1.45 * var(--group-scale, 1))); }
      70% { opacity: 0.48; transform: scale(calc(0.9 * var(--group-scale, 1))); }
    }

    @keyframes tDigitPopIn {
      0% {
        transform: translate(
          calc(var(--digit-distance) * var(--digit-dir-x)),
          calc(var(--digit-distance) * var(--digit-dir-y))
        );
        opacity: 0;
        filter: blur(var(--digit-blur));
      }
      100% { transform: translate(0, 0); opacity: 1; filter: blur(0); }
    }

    @keyframes horsePulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    .compiler {
      width: 360px;
      max-height: calc(100vh - 24px);
      overflow: auto;
      padding: 18px;
      border: 1px solid #313131;
      background: #202020;
      color: #f1f1f1;
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 100;
      box-shadow: none;
    }

    .compiler:not(.is-minimized) {
      left: auto;
      right: 12px;
    }

    .compiler.is-minimized {
      width: auto;
      max-height: none;
      overflow: visible;
      padding: 10px 12px;
    }

    .compiler.is-minimized .compiler-body {
      display: none;
    }

    .compiler-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .compiler h2 {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .compiler-label {
      color: #7fdc55;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .compiler p {
      margin: 0 0 16px;
      color: #a8a8a8;
      font-size: 12px;
      line-height: 1.45;
    }

    .compiler-search {
      width: 100%;
      margin: 0 0 10px;
      padding: 9px 10px;
      border: 1px solid #3d3d3d;

    const scoreReel = document.getElementById('scoreReel');
    const spinRays = document.querySelector('.spin-rays-green');
    const lensFlares = document.querySelector('.rays');
    const foregroundBushes = document.querySelector('.foreground-bushes');
    const ladyBug = document.getElementById('ladyBug');
    const ladyBugReverse = document.getElementById('ladyBugReverse');
    const ladyBugThird = document.getElementById('ladyBugThird');
    const screen = document.querySelector('.screen');
    const statusTime = document.getElementById('statusTime');
    const activityItems = [...document.querySelectorAll('.copy li')];
    const scoreStart = 96;
    const scoreMax = 160;
    let score = scoreStart;
    let spinRayTick = 0;
    let scoreCycleStep = 0;
    let scoreResetting = false;
    const ladyBugRuns = new Map();
    const ladyBugTargetCursors = new Map([[ladyBug, 0], [ladyBugReverse, 0], [ladyBugThird, 0]]);
    let pendingLadyBugTargetIndexes = null;
    let paused = false;
    const ladyBugFrames = [
      'assets/ladybug-frames/ladybug-frame-01.svg',
      'assets/ladybug-frames/ladybug-frame-02.svg',
      'assets/ladybug-frames/ladybug-frame-03.svg',

      'assets/ladybug-frames/ladybug-frame-07.svg',
      'assets/ladybug-frames/ladybug-frame-08.svg'
    ];
    const ladyBugFrameWidth = 76;
    const ladyBugFrameHeight = 44;
    const ladyBugBodyBase = 32;

    function formatStatusTime(date) {
      const suffix = date.getHours() >= 12 ? 'PM' : 'AM';
      const hours = date.getHours() % 12 || 12;
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}${suffix}`;
    }

    function updateStatusTime() {
      statusTime.textContent = formatStatusTime(new Date());
    }

    function renderScore(value, animateOnes = false, direction = 1) {
      const digits = String(value);
      scoreEl.style.setProperty('--score-digits', Math.min(digits.length, 3));
      scoreHundreds.textContent = digits.length > 2 ? digits.slice(0, -2) : '';
      scoreTens.textContent = digits.length > 1 ? digits.slice(-2, -1) : '';
      scoreOnes.textContent = digits.slice(-1);
      if (!animateOnes) return;
      scoreOnesGroup.style.setProperty('--digit-dir-y', direction < 0 ? '-1' : '1');
      scoreOnesGroup.classList.remove('is-animating');
      void scoreOnesGroup.offsetWidth;
      scoreOnesGroup.classList.add('is-animating');
    }

    function reelDigits(fromValue, toValue) {
      const fromDigits = String(fromValue).padStart(3, '0');
      const toDigits = String(toValue).padStart(3, '0');
      scoreReel.innerHTML = '';
      [...toDigits].forEach((digit, index) => {
        const fromDigit = Number(fromDigits[index]);
        const toDigit = Number(digit);
        const spins = 2 + index;
        const toIndex = spins * 10 + toDigit;
        const col = document.createElement('span');
        const strip = document.createElement('span');
        col.className = 'score-reel-col';
        strip.className = 'score-reel-strip';
        col.style.setProperty('--reel-from', fromDigit);
        col.style.setProperty('--reel-to', toIndex);
        col.style.setProperty('--reel-delay', `${index * 90}ms`);
        for (let i = 0; i <= toIndex; i += 1) {
          const cell = document.createElement('span');
          cell.className = 'score-reel-digit';
          cell.textContent = i % 10;
          strip.appendChild(cell);
        }
        col.appendChild(strip);
        scoreReel.appendChild(col);
        requestAnimationFrame(() => col.classList.add('is-spinning'));
      });
    }

    function resetScoreWithReel(fromValue) {
      scoreResetting = true;
      scoreBox.classList.add('is-resetting');
      setSolarResetState(true);
      clearActivityItems();
      reelDigits(fromValue, scoreStart);
      const duration = 1400 + 2 * 90 + 80;
      setTimeout(() => {
        score = scoreStart;
        scoreCycleStep = 0;
        renderScore(score, false);
        scoreBox.classList.remove('is-resetting');
        scoreReel.innerHTML = '';
        setSolarResetState(false);
        scoreResetting = false;
      }, duration);
    }

    function setSolarResetState(isResetting) {
      spinRays.style.animationPlayState = isResetting ? 'paused' : '';
      spinRays.style.transition = isResetting ? 'none' : '';
      lensFlares.style.animationPlayState = isResetting ? 'paused' : '';
    }

    function rotateSpinRays(delta) {
      spinRayTick += delta;
      spinRays.style.setProperty('--spin-rays-angle', `${spinRayTick * 45}deg`);
    }

    function markActivityItem(index) {
      activityItems.forEach((item, i) => {
        item.classList.toggle('is-active', i === index);
      });
    }

    function clearActivityItems() {
      activityItems.forEach((item) => item.classList.remove('is-active'));
    }

    function advanceScoreCycle() {
      if (scoreResetting) return;
      const step = scoreCycleStep % activityItems.length;
      const delta = step === activityItems.length - 1 ? -1 : 1;
      const next = score + delta;
      if (next > scoreMax) {
        resetScoreWithReel(next);
        return;
      }
      markActivityItem(step);
      rotateSpinRays(delta);
      score = next;
      renderScore(score, true, delta);
      scoreCycleStep += 1;
    }

    updateStatusTime();
    setInterval(updateStatusTime, 1000);
    renderScore(score);
    setInterval(advanceScoreCycle, 2000);

    function styleNumber(target, property, fallback = 0) {
      return Number.parseFloat(target.style[property] || getComputedStyle(target)[property]) || fallback;
    }

    function ladyBugSettings(bug = ladyBug) {
      return {
        speed: Math.max(Number.parseFloat(bug.style.getPropertyValue('--speed')) || 1, 0.1),
        appearance: Math.max(Number.parseFloat(bug.style.getPropertyValue('--ladybug-appearance')) || 1, 0.2),
        sizeRatio: Number.parseFloat(bug.style.getPropertyValue('--ladybug-size-ratio')) || 4
      };
    }

    function setLadyBugFrame(bug, frameIndex) {
      const image = bug.querySelector('img');
      if (image) image.src = ladyBugFrames[frameIndex] || ladyBugFrames[0];
    }

    function ladyBugBodySize(item, settings) {
      return Math.max(9, Math.min(64, Math.min(item.width, item.height) / settings.sizeRatio));
    }

    function applyLadyBugDisplaySize(bug, bodySize) {
      const scale = bodySize / ladyBugBodyBase;
      bug.style.width = `${ladyBugFrameWidth * scale}px`;
      bug.style.height = `${ladyBugFrameHeight * scale}px`;
      bug.dataset.ladybugBodySize = String(bodySize);
    }

    function ladyBugTargets(order = 'large-first') {
      const targets = [...document.querySelectorAll('.foreground-bushes .bush-item')].map((target, index) => {
        const left = styleNumber(target, 'left');
        const top = styleNumber(target, 'top');
        const width = styleNumber(target, 'width');
        const height = styleNumber(target, 'height');
        return {
          target,
          index,
          left,
          top,
          width,
          height,
          radius: Math.min(width, height) / 2
        };
      }).filter((item) => item.width >= 34 && item.height >= 34)
        .sort((a, b) => Math.min(b.width, b.height) - Math.min(a.width, a.height));
      return order === 'small-first' ? targets.reverse() : targets;
    }

    function scheduleLadyBug(bug = ladyBug, order = 'large-first', delay = 1800) {
      window.setTimeout(() => {
        if (paused) {
          scheduleLadyBug(bug, order, 320);
          return;
        }
        spawnLadyBug(bug, order);
      }, delay);
    }

    function ladyBugItemsAdjacent(a, b) {
      if (!a || !b) return false;
      if (a.target === b.target) return true;
      const ax = a.left + a.width / 2;
      const ay = a.top + a.height / 2;
      const bx = b.left + b.width / 2;
      const by = b.top + b.height / 2;
      const distance = Math.hypot(ax - bx, ay - by);
      return distance < (a.radius + b.radius) * 1.08;
    }

    function ladyBugConflictsWithActiveRun(bug, item) {
      return [...ladyBugRuns.entries()].some(([activeBug, run]) => {
        return activeBug !== bug && ladyBugItemsAdjacent(item, run.item);
      });
    }

    function syncLadyBugPendingTargets(targets) {
      const targetIndexes = new Set(targets.map((item) => item.index));
      if (!pendingLadyBugTargetIndexes) {
        pendingLadyBugTargetIndexes = new Set(targetIndexes);
        return;
      }
      pendingLadyBugTargetIndexes.forEach((index) => {
        if (!targetIndexes.has(index)) pendingLadyBugTargetIndexes.delete(index);
      });
      if (!pendingLadyBugTargetIndexes.size) {
        pendingLadyBugTargetIndexes = new Set(targetIndexes);
      }
    }

    function chooseLadyBugTarget(bug, targets) {
      syncLadyBugPendingTargets(targets);
      const pendingTargets = targets.filter((item) => pendingLadyBugTargetIndexes.has(item.index));
      for (const item of pendingTargets) {
        if (ladyBugConflictsWithActiveRun(bug, item)) continue;
        return item;
      }
      const cursor = ladyBugTargetCursors.get(bug) || 0;
      for (let offset = 0; offset < targets.length; offset += 1) {
        const index = (cursor + offset) % targets.length;
        const item = targets[index];
        if (ladyBugConflictsWithActiveRun(bug, item)) continue;
        ladyBugTargetCursors.set(bug, index + 1);
        return item;
      }
      ladyBugTargetCursors.set(bug, cursor + 1);
      return null;
    }

    function spawnLadyBug(bug = ladyBug, order = 'large-first') {
      const targets = ladyBugTargets(order);
      if (!targets.length) return scheduleLadyBug(bug, order, 3000);
      const settings = ladyBugSettings(bug);
      const item = chooseLadyBugTarget(bug, targets);
      if (!item) return scheduleLadyBug(bug, order, 620 / settings.appearance);
      const size = ladyBugBodySize(item, settings);
      const direction = Math.random() > 0.5 ? 1 : -1;
      const startAngle = visibleLadyBugStartAngle(item, size);
      if (startAngle == null) return scheduleLadyBug(bug, order, 260 / settings.appearance);
      pendingLadyBugTargetIndexes?.delete(item.index);
      const turns = 0.18 + Math.random() * 0.54;
      const angleDistance = turns * Math.PI * 2 * direction;
      const duration = Math.max(1600, Math.abs(turns) * 8200 / settings.speed);
      const centerX = item.left + item.width / 2;
      const centerY = item.top + item.height / 2;
      const radius = item.radius + size * 0.04;

      foregroundBushes.appendChild(bug);

      setLadyBugFrame(bug, 0);
      applyLadyBugDisplaySize(bug, size);
      bug.dataset.ladybugTargetIndex = String(item.index);
      bug.dataset.ladybugOrder = order;
      bug.style.opacity = '1';
      bug.classList.add('is-visible');
      ladyBugRuns.set(bug, {
        start: performance.now(),
        duration,
        order,
        item,
        centerX,
        centerY,
        radius,
        baseRadius: item.radius,
        startAngle,
        angleDistance,
        direction,
        settings
      });
      requestAnimationFrame((now) => updateLadyBug(bug, now));
    }

    function resizeLadyBug(bug) {
      const run = ladyBugRuns.get(bug);
      if (!run) return;
      const settings = ladyBugSettings(bug);
      const size = ladyBugBodySize(run.item, settings);
      applyLadyBugDisplaySize(bug, size);
      run.radius = run.baseRadius + size * 0.04;
      run.settings = settings;
    }

    function visibleLadyBugStartAngle(item, size) {
      for (let i = 0; i < 24; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const x = item.left + item.width / 2 + Math.cos(angle) * (item.radius + size * 0.04);
        const y = item.top + item.height / 2 + Math.sin(angle) * (item.radius + size * 0.04);
        if (!ladyBugPointOccluded(item, x, y, size)) return angle;
      }
      return null;
    }

    function ladyBugCircleOverlaps(a, b) {
      const ax = a.left + a.width / 2;
      const ay = a.top + a.height / 2;
      const bx = b.left + b.width / 2;
      const by = b.top + b.height / 2;
      return Math.hypot(ax - bx, ay - by) < a.radius + Math.min(b.width, b.height) / 2;
    }

    function ladyBugCoverChain(item) {
      const covers = [];
      const visited = new Set([item.index]);
      const queue = [item];
      const targets = ladyBugTargets();
      while (queue.length) {
        const base = queue.shift();
        targets.forEach((cover) => {
          if (visited.has(cover.index) || cover.index <= base.index) return;
          if (!ladyBugCircleOverlaps(base, cover)) return;
          visited.add(cover.index);
          covers.push(cover);
          queue.push(cover);
        });
      }
      return covers.sort((a, b) => b.index - a.index);
    }

    function ladyBugCoveringCircle(item, x, y, size) {
      return ladyBugCoverChain(item).find((cover) => {
        const cx = cover.left + cover.width / 2;
        const cy = cover.top + cover.height / 2;
        const bugDistance = Math.hypot(x - cx, y - cy);
        return bugDistance < Math.max(cover.width, cover.height) / 2 + size * 0.5;
      });
    }

    function ladyBugPointOccluded(item, x, y, size) {
      return Boolean(ladyBugCoveringCircle(item, x, y, size));
    }

    function applyLadyBugCoverMask(bug, cover, x, y, size) {
      if (!cover) {
        bug.style.webkitMaskImage = '';
        bug.style.maskImage = '';
        return;
      }
      const coverX = cover.left + cover.width / 2;
      const coverY = cover.top + cover.height / 2;
      const maskX = size / 2 + coverX - x;
      const maskY = size / 2 + coverY - y;
      const maskRadius = Math.max(cover.width, cover.height) / 2;
      const mask = `radial-gradient(circle ${maskRadius}px at ${maskX}px ${maskY}px, transparent 0 ${maskRadius}px, #000 ${maskRadius + 0.5}px)`;
      bug.style.webkitMaskImage = mask;
      bug.style.maskImage = mask;
    }

    function finishLadyBugRun(bug = ladyBug, delay = 900) {
      const run = ladyBugRuns.get(bug);
      bug.classList.remove('is-visible');
      bug.style.opacity = '0';
      bug.style.setProperty('--ladybug-rotation', '0deg');
      delete bug.dataset.ladybugTargetIndex;
      applyLadyBugCoverMask(bug);
      ladyBugRuns.delete(bug);
      scheduleLadyBug(bug, run?.order || bug.dataset.ladybugOrder || 'large-first', delay);
    }

    function finishLadyBugFlight(bug = ladyBug, delay = 900) {
      bug.classList.remove('is-visible');
      bug.style.opacity = '0';
      bug.style.setProperty('--ladybug-rotation', '0deg');
      bug.style.transform = '';
      delete bug.dataset.ladybugTargetIndex;
      applyLadyBugCoverMask(bug);
      scheduleLadyBug(bug, bug.dataset.ladybugOrder || 'large-first', delay);
    }

    function startLadyBugTakeoff(bug = ladyBug) {
      const run = ladyBugRuns.get(bug);
      if (!run) return;
      ladyBugRuns.delete(bug);
      delete bug.dataset.ladybugTargetIndex;
      applyLadyBugCoverMask(bug);
      const nextDelay = (1300 + Math.random() * 4200) / run.settings.appearance;
      bug.style.setProperty('--ladybug-rotation', '0deg');
      [1, 2, 3, 4, 5, 6].forEach((frameIndex, index) => {
        window.setTimeout(() => {
          if (bug.classList.contains('is-visible')) setLadyBugFrame(bug, frameIndex);
        }, index * 90);
      });
      window.setTimeout(() => {
        if (!bug.classList.contains('is-visible')) return;
        setLadyBugFrame(bug, 7);
        startLadyBugFlight(bug, run, nextDelay);
      }, 620);
    }

    function startLadyBugFlight(bug, run, nextDelay) {
      const startX = run.lastX ?? run.centerX;
      const startY = run.lastY ?? run.centerY;
      const duration = 2300;
      const minX = 0;
      const maxX = 640;
      const backgroundLimitY = 667.13 - 857 + 16;
      const direction = startX < 320 ? 1 : -1;
      const targetY = Math.max(backgroundLimitY, startY - 250 - Math.random() * 80);
      const endX = Math.min(maxX, Math.max(minX, startX + direction * (70 + Math.random() * 80)));
      const control1 = {
        x: Math.min(maxX, Math.max(minX, startX + direction * (18 + Math.random() * 18))),
        y: Math.max(backgroundLimitY, startY - (70 + Math.random() * 45))
      };
      const control2 = {
        x: Math.min(maxX, Math.max(minX, startX - direction * (54 + Math.random() * 44))),
        y: Math.max(backgroundLimitY, startY - (150 + Math.random() * 50))
      };
      const end = { x: endX, y: targetY };
      const started = performance.now();
      const curvePoint = (t) => {
        const u = 1 - t;
        return {
          x: u ** 3 * startX + 3 * u ** 2 * t * control1.x + 3 * u * t ** 2 * control2.x + t ** 3 * end.x,
          y: u ** 3 * startY + 3 * u ** 2 * t * control1.y + 3 * u * t ** 2 * control2.y + t ** 3 * end.y
        };
      };
      const fly = (now) => {
        const t = Math.min((now - started) / duration, 1);
        const ease = t < 0.18
          ? (t / 0.18) ** 2 * 0.18
          : t > 0.76
            ? 1 - ((1 - t) / 0.24) ** 2 * 0.24
            : t;
        const point = curvePoint(ease);
        const nextPoint = curvePoint(Math.min(1, ease + 0.02));
        const cruise = Math.sin(t * Math.PI * 5) * 6 * (1 - t);
        const x = Math.min(maxX, Math.max(minX, point.x + Math.sin(t * Math.PI * 2.5) * 6 * (1 - t)));
        const y = Math.max(backgroundLimitY, point.y + cruise);
        const pathAngle = Math.atan2(nextPoint.y - point.y, nextPoint.x - point.x) * 180 / Math.PI + 90;
        const scale = 1 - t * 0.46;
        bug.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale})`;
        bug.style.setProperty('--ladybug-rotation', `${pathAngle}deg`);
        bug.style.opacity = String(Math.max(0, 1 - t));
        if (t < 1) {
          requestAnimationFrame(fly);
          return;
        }
        finishLadyBugFlight(bug, nextDelay);
      };
      requestAnimationFrame(fly);
    }

    function ladyBugIntersectsOtherBug(bug, x, y, size) {
      return [...ladyBugRuns.entries()].some(([activeBug, run]) => {
        if (activeBug === bug) return false;
        const otherSize = Number.parseFloat(activeBug.dataset.ladybugBodySize) || 32;
        const progress = Math.min((performance.now() - run.start) / run.duration, 1);
        const angle = run.startAngle + run.angleDistance * progress;
        const otherX = run.centerX + Math.cos(angle) * run.radius;
        const otherY = run.centerY + Math.sin(angle) * run.radius;
        return Math.hypot(x - otherX, y - otherY) < (size + otherSize) * 0.58;
      });
    }

    function updateLadyBug(bug, now) {
      if (!ladyBugRuns.has(bug)) return;
      const run = ladyBugRuns.get(bug);
      if (paused) {
        if (!run.pausedAt) run.pausedAt = now;
        return;
      }
      if (run.pausedAt) {
        run.start += now - run.pausedAt;
        run.pausedAt = null;
      }
      const elapsed = now - run.start;
      let progress = Math.min(elapsed / run.duration, 1);
      const angle = run.startAngle + run.angleDistance * progress;
      const x = run.centerX + Math.cos(angle) * run.radius;
      const y = run.centerY + Math.sin(angle) * run.radius;
      run.lastX = x;
      run.lastY = y;
      const size = Number.parseFloat(bug.dataset.ladybugBodySize) || 32;
      const tangentAngle = angle + run.direction * Math.PI / 2;
      const rotation = tangentAngle * 180 / Math.PI + 90;
      bug.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
      bug.style.setProperty('--ladybug-rotation', `${rotation}deg`);
      if (ladyBugIntersectsOtherBug(bug, x, y, size)) {
        finishLadyBugRun(bug, 480 / run.settings.appearance);
        return;
      }
      const cover = ladyBugCoveringCircle(run.item, x, y, size);
      applyLadyBugCoverMask(bug, cover, x, y, size);
      bug.style.opacity = '1';
      if (progress < 1) {
        requestAnimationFrame((nextNow) => updateLadyBug(bug, nextNow));
        return;
      }
      startLadyBugTakeoff(bug);
    }

    function matrixTranslateX(target) {

    function controlCard(target, i) {

      const isScore = target === scoreEl;
      const isGroupScale = target.classList.contains('group-scale-control');
      const isRays = target.classList.contains('rays');
      const isLadyBug = target.classList.contains('ladybug');
      const groupScale = isGroupScale ? (target.style.getPropertyValue('--group-scale') || '1') : '1';
      const speedValue = isRays ? '0.2' : '1';
      const directionValue = '1';
      const rhythmValue = '2';
      const pos = isCloud ? cloudScreenPosition(target) : { x: 0, y: 0, width: 0, height: 0 };
      const scorePos = isScore ? scoreScreenPosition() : { x: 0, y: 0 };
      card.className = 'control-card';
      card.dataset.label = label.toLowerCase();
      card.dataset.index = i;
      card.innerHTML = `
        <div class="control-title">
          <strong>${label}</strong>
          <button type="button" data-select="${i}">Select</button>
        </div>
        <label class="control-row" for="${id}-speed">
          <span>Rate</span>
          <input id="${id}-speed" data-kind="speed" data-index="${i}" type="range" min="0" max="3" step="0.05" value="${speedValue}">
          <output>${Number(speedValue).toFixed(2)}</output>
        </label>
        <label class="control-row" for="${id}-direction">
          <span>Direction</span>
          <input id="${id}-direction" data-kind="direction" data-index="${i}" type="range" min="-1" max="1" step="1" value="${directionValue}">
          <output>→</output>
        </label>
        <label class="control-row" for="${id}-rhythm">
          <span>Rhythm</span>
          <input id="${id}-rhythm" data-kind="rhythm" data-index="${i}" type="range" min="0" max="4" step="1" value="${rhythmValue}">
          <output>ease</output>
        </label>
        ${isGroupScale ? `
        <label class="control-row" for="${id}-group-scale">
          <span>Size</span>
          <input id="${id}-group-scale" data-kind="groupScale" data-index="${i}" type="range" min="0.5" max="3" step="0.05" value="${groupScale}">
          <output>${Number(groupScale).toFixed(2)}</output>
        </label>
        ` : ''}
        ${isRays ? `
        <label class="control-row" for="${id}-flare-scale">
          <span>Flare scale</span>
          <input id="${id}-flare-scale" data-kind="flareScale" data-index="${i}" type="range" min="0.5" max="2" step="0.05" value="1.35">
          <output>1.35</output>
        </label>
        <label class="control-row" for="${id}-flare-distance">
          <span>Distance</span>
          <input id="${id}-flare-distance" data-kind="flareDistance" data-index="${i}" type="range" min="0" max="1" step="0.05" value="0">
          <output>0.00</output>
        </label>
        <label class="control-row" for="${id}-flare-rotate">
          <span>Rotate</span>
          <input id="${id}-flare-rotate" data-kind="flareRotate" data-index="${i}" type="range" min="-60" max="60" step="1" value="60">
          <output>60°</output>
        </label>
        <label class="control-row" for="${id}-flare-opacity-1">
          <span>Opacity 1</span>
          <input id="${id}-flare-opacity-1" data-kind="flareOpacity1" data-index="${i}" type="range" min="0" max="1" step="0.01" value="1">
          <output>1.00</output>
        </label>
        <label class="control-row" for="${id}-flare-opacity-2">
          <span>Opacity 2</span>
          <input id="${id}-flare-opacity-2" data-kind="flareOpacity2" data-index="${i}" type="range" min="0" max="1" step="0.01" value="0.82">
          <output>0.82</output>
        </label>
        <label class="control-row" for="${id}-flare-opacity-3">
          <span>Opacity 3</span>
          <input id="${id}-flare-opacity-3" data-kind="flareOpacity3" data-index="${i}" type="range" min="0" max="1" step="0.01" value="0.62">
          <output>0.62</output>
        </label>
        ` : ''}
        ${isLadyBug ? `
        <label class="control-row" for="${id}-ladybug-appearance">
          <span>Appearance</span>
          <input id="${id}-ladybug-appearance" data-kind="ladybugAppearance" data-index="${i}" type="range" min="0.2" max="3" step="0.05" value="1">
          <output>1.00</output>
        </label>
        <label class="control-row" for="${id}-ladybug-size-ratio">
          <span>Size ratio</span>
          <input id="${id}-ladybug-size-ratio" data-kind="ladybugSizeRatio" data-index="${i}" type="range" min="4" max="6.5" step="0.1" value="4">
          <output>1:5.0</output>
        </label>
        ` : ''}
        ${isCloud ? `
        <label class="control-row" for="${id}-x">
          <span>X</span>
          <input id="${id}-x" data-kind="x" data-index="${i}" type="range" min="${Math.round((pos.width + 120) * -1)}" max="760" step="1" value="${Math.round(pos.x)}">
          <output>${Math.round(pos.x)}</output>
        </label>
        <label class="control-row" for="${id}-y">
          <span>Y</span>
          <input id="${id}-y" data-kind="y" data-index="${i}" type="range" min="${Math.round(pos.height * -1)}" max="1136" step="1" value="${Math.round(pos.y)}">
          <output>${Math.round(pos.y)}</output>
        </label>
        ` : ''}
        ${isScore ? `
        <label class="control-row" for="${id}-score-font-size">
          <span>Font size</span>
          <input id="${id}-score-font-size" data-kind="scoreFontSize" data-index="${i}" data-default="72" type="number" min="10" max="160" step="1" value="72">
          <output>px</output>
        </label>
        <label class="control-row" for="${id}-score-font-weight">
          <span>Weight</span>
          <input id="${id}-score-font-weight" data-kind="scoreFontWeight" data-index="${i}" data-default="400" type="number" min="100" max="900" step="50" value="400">
          <output></output>
        </label>
        <label class="control-row" for="${id}-score-x">
          <span>X</span>
          <input id="${id}-score-x" data-kind="scoreX" data-index="${i}" data-default="${Math.round(scorePos.x)}" type="number" min="-200" max="640" step="1" value="${Math.round(scorePos.x)}">
          <output>px</output>
        </label>
        <label class="control-row" for="${id}-score-y">
          <span>Y</span>
          <input id="${id}-score-y" data-kind="scoreY" data-index="${i}" data-default="${Math.round(scorePos.y)}" type="number" min="-200" max="1136" step="1" value="${Math.round(scorePos.y)}">
          <output>px</output>
        </label>
        <label class="control-row" for="${id}-score-letter-space">
          <span>Letter</span>
          <input id="${id}-score-letter-space" data-kind="scoreLetterSpace" data-index="${i}" data-default="2" type="number" min="-20" max="40" step="0.5" value="2">
          <output>px</output>
        </label>
        <label class="control-row" for="${id}-score-line-height">
          <span>Line height</span>
          <input id="${id}-score-line-height" data-kind="scoreLineHeight" data-index="${i}" data-default="1" type="number" min="0.5" max="2" step="0.01" value="1">
          <output></output>
        </label>
        ` : ''}
      `;
      return card;
    }

    function selectTarget(index) {
      const target = controlled[Number(index)];
      const card = cards[Number(index)];
      if (!target || !card) return;
      selectedTarget?.classList.remove('selected-target');
      selectedCard?.classList.remove('is-active');
      selectedTarget = target;
      selectedCard = card;
      selectedTarget.classList.add('selected-target');
      selectedCard.classList.add('is-active');
      selectedCard.scrollIntoView({ block: 'center' });
    }

    function filterControls() {
      const query = controlSearch.value.trim().toLowerCase();
      cards.forEach((card) => {
        card.classList.toggle('is-hidden', query && !card.dataset.label.includes(query));
      });
    }

    function applyControl(input) {
      const target = controlled[Number(input.dataset.index)];
      const output = input.parentElement.querySelector('output');
      if (input.dataset.kind === 'speed') {
        target.style.setProperty('--speed', input.value);
        output.textContent = Number(input.value).toFixed(2);
      }
      if (input.dataset.kind === 'direction') {
        const reverse = Number(input.value) < 0;
        target.style.setProperty('--direction', reverse ? 'reverse' : 'normal');
        output.textContent = reverse ? '←' : '→';
      }
      if (input.dataset.kind === 'rhythm') {
        const value = Number(input.value);
        target.style.setProperty('--ease', easeMap[value]);
        output.textContent = ['linear', 'soft', 'ease', 'spring', 'step'][value];
      }
      if (input.dataset.kind === 'groupScale') {
        target.style.setProperty('--group-scale', input.value);
        output.textContent = Number(input.value).toFixed(2);
      }
      if (input.dataset.kind === 'flareScale') {
        target.style.setProperty('--flare-scale', input.value);
        output.textContent = Number(input.value).toFixed(2);
      }
      if (input.dataset.kind === 'flareDistance') {
        target.style.setProperty('--flare-distance', input.value);
        output.textContent = Number(input.value).toFixed(2);
      }
      if (input.dataset.kind === 'flareRotate') {
        target.style.setProperty('--flare-rotate', `${Number(input.value)}deg`);
        output.textContent = `${Number(input.value)}°`;
      }
      if (input.dataset.kind === 'flareOpacity1') {
        target.style.setProperty('--flare-opacity-1', input.value);
        output.textContent = Number(input.value).toFixed(2);
      }
      if (input.dataset.kind === 'flareOpacity2') {
        target.style.setProperty('--flare-opacity-2', input.value);
        output.textContent = Number(input.value).toFixed(2);
      }
      if (input.dataset.kind === 'flareOpacity3') {
        target.style.setProperty('--flare-opacity-3', input.value);
        output.textContent = Number(input.value).toFixed(2);
      }
      if (input.dataset.kind === 'ladybugAppearance') {
        target.style.setProperty('--ladybug-appearance', input.value);
        output.textContent = Number(input.value).toFixed(2);
      }
      if (input.dataset.kind === 'ladybugSizeRatio') {
        target.style.setProperty('--ladybug-size-ratio', input.value);
        output.textContent = `1:${Number(input.value).toFixed(1)}`;
        resizeLadyBug(target);
      }
      if (input.dataset.kind === 'x') {
        const clouds = document.querySelector('.clouds');
        const desired = Number(input.value);
        const containerX = parseFloat(clouds.style.left || getComputedStyle(clouds).left) || 0;
        target.style.left = `${desired - containerX - matrixTranslateX(target)}px`;
        setCloudPath(target);
        output.textContent = Math.round(desired);
      }
      if (input.dataset.kind === 'y') {
        const clouds = document.querySelector('.clouds');
        const desired = Number(input.value);
        const containerY = parseFloat(clouds.style.top || getComputedStyle(clouds).top) || 0;
        target.style.top = `${desired - containerY}px`;
        output.textContent = Math.round(desired);
      }
      if (input.dataset.kind === 'scoreFontSize') {
        scoreBox.style.setProperty('--score-font-size', `${Number(input.value)}px`);
      }
      if (input.dataset.kind === 'scoreFontWeight') {
        scoreBox.style.setProperty('--score-font-weight', Number(input.value));
      }
      if (input.dataset.kind === 'scoreX') {
        const infoX = parseFloat(getComputedStyle(document.querySelector('.info')).left) || 0;
        scoreBox.style.left = `${Number(input.value) - infoX}px`;
      }
      if (input.dataset.kind === 'scoreY') {
        const infoY = parseFloat(getComputedStyle(document.querySelector('.info')).top) || 0;
        scoreBox.style.top = `${Number(input.value) - infoY}px`;
      }
      if (input.dataset.kind === 'scoreLetterSpace') {
        scoreBox.style.setProperty('--score-letter-space', `${Number(input.value)}px`);
      }
      if (input.dataset.kind === 'scoreLineHeight') {
        scoreBox.style.setProperty('--score-line-height', Number(input.value));
      }
      if (target.classList.contains('cloud')) saveCloudSettings();
      syncFollowers(target);
    }

    function syncFollowers(target) {
      document.querySelectorAll(`[data-follow-control="${target.dataset.control}"]`).forEach((follower) => {
        follower.style.setProperty('--speed', target.style.getPropertyValue('--speed') || '1');
        follower.style.setProperty('--direction', target.style.getPropertyValue('--direction') || 'normal');
        follower.style.setProperty('--ease', target.style.getPropertyValue('--ease') || 'ease-in-out');
      });
    }

    restoreCloudSettings();

    controlled.forEach((target, i) => {
      target.closest('.layer, .info')?.classList.add('clickable-region');
      if (target.classList.contains('cloud')) {
        setCloudPath(target);
        const pos = cloudScreenPosition(target);
        target.dataset.initialX = Math.round(pos.x);
        target.dataset.initialY = Math.round(pos.y);
      }
      if (target.classList.contains('group-scale-control')) {
        target.dataset.initialGroupScale = target.style.getPropertyValue('--group-scale') || '1';
      }
      const card = controlCard(target, i);
      cards.push(card);
      controlList.appendChild(card);
    });

    document.querySelectorAll('.compiler input[data-kind]').forEach((input) => {
      const target = controlled[Number(input.dataset.index)];
      if (target?.classList.contains('cloud') && (input.dataset.kind === 'x' || input.dataset.kind === 'y')) {
        input.parentElement.querySelector('output').textContent = Math.round(Number(input.value));
        return;
      }
      applyControl(input);
    });
    if (!restoreAllSettings()) applyRequestedDefaults();

    controlList.addEventListener('input', (event) => {
      if (event.target.matches('input[data-kind]')) applyControl(event.target);
    });

    controlList.addEventListener('click', (event) => {
      const selectButton = event.target.closest('[data-select]');
      const card = event.target.closest('.control-card');
      if (selectButton) {
        selectTarget(selectButton.dataset.select);
        return;
      }
      if (card) selectTarget(card.dataset.index);
    });

    phoneShell.addEventListener('click', (event) => {
      const target = event.target.closest('[data-control]')
        || document.elementsFromPoint(event.clientX, event.clientY)
          .map((element) => element.closest('[data-control]'))
          .find((element) => element && phoneShell.contains(element));
      if (!target || !phoneShell.contains(target)) return;
      event.preventDefault();
      event.stopPropagation();
      const index = controlled.indexOf(target);
      if (index < 0) return;
      if (controlSearch.value) {
        controlSearch.value = '';
        filterControls();
      }
      selectTarget(index);
    });

    controlSearch.addEventListener('input', filterControls);

    document.getElementById('resetControls').addEventListener('click', () => {
      document.querySelectorAll('.compiler input').forEach((input) => {
        if (!input.dataset.kind) return;
        const target = controlled[Number(input.dataset.index)];
        if (input.dataset.kind === 'rhythm') input.value = 2;
        if (input.dataset.kind === 'speed') input.value = target.classList.contains('rays') ? 0.2 : 1;
        if (input.dataset.kind === 'direction') input.value = 1;
        if (input.dataset.kind === 'groupScale') input.value = target.dataset.initialGroupScale || 1;
        if (input.dataset.kind === 'flareScale') input.value = 1.35;
        if (input.dataset.kind === 'flareDistance') input.value = 0;
        if (input.dataset.kind === 'flareRotate') input.value = 60;
        if (input.dataset.kind === 'flareOpacity1') input.value = 1;
        if (input.dataset.kind === 'flareOpacity2') input.value = 0.82;
        if (input.dataset.kind === 'flareOpacity3') input.value = 0.62;
        if (input.dataset.kind === 'ladybugAppearance') input.value = 1;
        if (input.dataset.kind === 'ladybugSizeRatio') input.value = 4;
        if (input.dataset.kind === 'x') input.value = target.dataset.initialX;
        if (input.dataset.kind === 'y') input.value = target.dataset.initialY;
        if (input.type === 'number' && input.dataset.default) input.value = input.dataset.default;
        applyControl(input);
      });
      saveAllSettings();
    });

    document.getElementById('pauseControls').addEventListener('click', (event) => {
      paused = !paused;
      document.querySelectorAll('.animatable, .score-value, .grass-dot').forEach((el) => {
        el.style.animationPlayState = paused ? 'paused' : 'running';
      });
      if (!paused) {
        ladyBugRuns.forEach((_, bug) => {
          requestAnimationFrame((now) => updateLadyBug(bug, now));
        });
      }
      event.currentTarget.textContent = paused ? 'Resume all' : 'Pause all';
    });

    document.getElementById('saveClouds').addEventListener('click', (event) => {
      commitCurrentCloudPositions();
      saveCloudSettings();
      event.currentTarget.textContent = 'Saved';
      setTimeout(() => {
        event.currentTarget.textContent = 'Save clouds';
      }, 900);
    });

    document.getElementById('saveAllControls').addEventListener('click', (event) => {
      saveAllSettings();
      event.currentTarget.textContent = 'Saved';
      setTimeout(() => {
        event.currentTarget.textContent = 'Save all';
      }, 900);
    });

    document.getElementById('toggleCompiler').addEventListener('click', (event) => {
      const compiler = event.currentTarget.closest('.compiler');
      const minimized = compiler.classList.toggle('is-minimized');
      event.currentTarget.textContent = minimized ? 'Expand' : 'Minimize';
    });

    requestAnimationFrame(syncCloudPositionControls);
  </script>
</body>
</html>
